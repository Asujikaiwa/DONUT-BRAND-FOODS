<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- title / description / canonical / hreflang / og / JSON-LD ของแต่ละหน้า
         ถูกเติมอัตโนมัติตอน build โดย scripts/prerender.mjs (ดู entry-server.tsx)
         URL แยกภาษา: /  (ไทย)  /en/  (อังกฤษ)  /zh/  (จีน) -->
    <!--app-head-->
    <meta name="author" content="บริษัท อธิปพาณิชย์ จำกัด">

    <link rel="icon" type="image/jpeg" href="/PictureProduct/Other/Logo/logo.jpg" />

    <!-- Fonts: preconnect first so they start downloading sooner -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Tailwind is now compiled at build time (index.css + vite.config.ts).
         The old cdn.tailwindcss.com script and the esm.sh import map were removed
         because they were dev-only / runtime-compiled and slowed first paint.
         Vite injects the bundled, minified CSS + JS automatically. -->

    <!-- Structured data: helps Google understand the business (rich results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://athip-panich.com/#organization",
      "name": "บริษัท อธิปพาณิชย์ จำกัด",
      "legalName": "Athip Panich Co., Ltd.",
      "alternateName": ["ตราโดนัท", "Donut Brand"],
      "url": "https://athip-panich.com/",
      "logo": "https://athip-panich.com/PictureProduct/Other/Logo/logo.jpg",
      "image": "https://athip-panich.com/PictureProduct/Other/Logo/logo.jpg",
      "description": "ผู้ผลิตและจำหน่ายผงปรุงรส ตราโดนัท (Donut Brand) คุณภาพสูง มาตรฐาน CODEX HACCP & GHPs เช่น ผงชีส บาร์บีคิว ปาปริก้า ผงเครื่องดื่ม และวัตถุเจือปนอาหาร",
      "foundingDate": "2000",
      "founder": { "@type": "Person", "name": "คนึงรัตน์ ใจตรง" },
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "HGR5+2PG, Unnamed Road, ตำบลบ้านคลองสวน",
        "addressLocality": "อำเภอพระสมุทรเจดีย์",
        "addressRegion": "สมุทรปราการ",
        "postalCode": "10290",
        "addressCountry": "TH"
      },
      "telephone": "+66-91-803-3478",
      "email": "athip_panich@hotmail.com",
      "contactPoint": [{
        "@type": "ContactPoint",
        "contactType": "sales",
        "telephone": "+66-91-803-3478",
        "email": "athip_panich@hotmail.com",
        "areaServed": "TH",
        "availableLanguage": ["th", "en", "zh"]
      }],
      "sameAs": [
        "https://www.facebook.com/athip.panich.donut/",
        "https://www.instagram.com/don_utbrand/",
        "https://www.tiktok.com/@donut.athip"
      ],
      "knowsAbout": [
        "ผงปรุงรส", "ผงชีส", "ผงบาร์บีคิว", "ผงปาปริก้า",
        "เครื่องดื่มชนิดผง", "วัตถุเจือปนอาหาร",
        "รับผลิตผงปรุงรส OEM", "CODEX HACCP", "GHPs"
      ],
      "brand": {
        "@type": "Brand",
        "name": "ตราโดนัท",
        "alternateName": ["Donut Brand", "甜甜圈品牌"],
        "logo": "https://athip-panich.com/PictureProduct/Other/Logo/logo.jpg"
      }
    }
    </script>

  </head>
  <body>
    <!-- เนื้อหาจริงของแต่ละหน้าถูก prerender ใส่ตรงนี้ตอน build -->
    <div id="root"><!--app-html--></div>
    <!--app-data-->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
